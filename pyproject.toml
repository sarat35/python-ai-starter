[project]
name = "python-ai-starter"
version = "0.1.0"
description = "Reusable AI project template"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
python-ai-starter = "app.main:main"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "ruff>=0.12.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ipykernel>=6.30.0",
    "pre-commit>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
